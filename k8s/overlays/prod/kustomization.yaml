apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-prod

resources:
  - namespace.yaml
  - ../../base
  - pdb.yaml
  - hpa.yaml

images:
  - name: demo-api
    newTag: 0.1.0

replicas:
  - name: demo-api
    count: 3

patches:
  - path: patch-deployment.yaml
  - path: patch-ingress.yaml
