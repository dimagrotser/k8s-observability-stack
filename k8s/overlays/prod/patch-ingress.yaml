# A separate host, so dev and prod can be deployed to the same local cluster
# at the same time without fighting over demo.localhost.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api
spec:
  rules:
    - host: demo-prod.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-api
                port:
                  name: http
