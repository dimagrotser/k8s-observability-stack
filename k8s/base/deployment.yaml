apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: k8s-observability-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: k8s-observability-stack
    spec:
      securityContext:
        runAsNonRoot: true
        # Matches the uid baked into the distroless "nonroot" base image.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-api
          image: demo-api:0.1.0
          ports:
            # Named so the Service and the ServiceMonitor can refer to it by
            # name instead of repeating the number.
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: ERROR_RATE
              value: "0"
            - name: EXTRA_LATENCY_MS
              value: "0"
            - name: READY_DELAY_MS
              value: "2000"
          # Startup probe first: it gives the process room to warm up without
          # forcing the liveness probe to carry a long failureThreshold.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # The root filesystem is read-only, so anything that wants a scratch
            # directory gets this one instead.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Slightly longer than the app's own 5s drain window.
      terminationGracePeriodSeconds: 20
