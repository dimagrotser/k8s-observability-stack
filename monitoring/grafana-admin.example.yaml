# Shape of the Secret that Grafana reads its credentials from.
#
# Do NOT fill this in and commit it. `make grafana-secret` generates a random
# password into monitoring/secrets/grafana-admin-password.txt (gitignored) and
# applies the Secret for you. This file exists so the expected keys are visible
# without having to read the Helm values.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: replace-me
